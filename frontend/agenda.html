<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RafaLink CRM - Agenda</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/activity-ui.js"></script>
  <script>
    const state = { view: "week", anchor: new Date(), owner: "me" };
    let items = [];

    function mondayOf(d) {
      const s = startOfDay(d);
      return addDays(s, -((s.getDay() + 6) % 7));
    }

    // Intervalo [início, fim) em horário local
    function range() {
      const a = startOfDay(state.anchor);
      if (state.view === "day") return [a, addDays(a, 1)];
      if (state.view === "week") {
        const s = mondayOf(a);
        return [s, addDays(s, 7)];
      }
      const s = mondayOf(new Date(a.getFullYear(), a.getMonth(), 1));
      return [s, addDays(s, 42)];
    }

    function titleText() {
      const a = state.anchor;
      if (state.view === "day") {
        return a.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      }
      if (state.view === "week") {
        const s = range()[0];
        const e = addDays(s, 6);
        return `${s.toLocaleDateString("pt-BR", { day: "numeric", month: "short" })} – ${e.toLocaleDateString("pt-BR", { day: "numeric", month: "short", year: "numeric" })}`;
      }
      return a.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    }

    function shift(dir) {
      const a = state.anchor;
      if (state.view === "day") state.anchor = addDays(a, dir);
      else if (state.view === "week") state.anchor = addDays(a, 7 * dir);
      else state.anchor = new Date(a.getFullYear(), a.getMonth() + dir, 1);
      load();
    }

    function init() {
      const content = renderLayout("agenda", "Agenda");
      content.innerHTML = `
        <div class="page-head">
          <h2>Agenda</h2>
          <button class="btn btn-primary" id="newBtn">+ Nova atividade</button>
        </div>
        <div class="cal-bar">
          <div class="segmented" id="views">
            <button data-v="day">Hoje / Dia</button>
            <button data-v="week">Semana</button>
            <button data-v="month">Mês</button>
          </div>
          <button class="btn" id="prev">←</button>
          <div class="cal-title" id="title"></div>
          <button class="btn" id="next">→</button>
          <button class="btn" id="today">Hoje</button>
          <select id="fowner" style="width:auto">
            <option value="me">Minha agenda</option>
            <option value="all">Toda a equipe</option>
          </select>
        </div>
        <div id="cal"></div>`;

      document.getElementById("views").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        state.view = b.dataset.v;
        if (state.view === "day") state.anchor = new Date();
        load();
      });
      document.getElementById("prev").addEventListener("click", () => shift(-1));
      document.getElementById("next").addEventListener("click", () => shift(1));
      document.getElementById("today").addEventListener("click", () => { state.anchor = new Date(); load(); });
      document.getElementById("fowner").addEventListener("change", (e) => { state.owner = e.target.value; load(); });

      document.getElementById("newBtn").addEventListener("click", async () => {
        try {
          const options = await api("/activities/options");
          openActivityForm({ options, defaults: { type: "REUNIAO" }, onSaved: load });
        } catch (err) {
          toast(err.message, "err");
        }
      });

      document.getElementById("cal").addEventListener("click", (e) => {
        const chip = e.target.closest(".chip, .agenda-item");
        if (chip) {
          const a = items.find((x) => x.id === Number(chip.dataset.id));
          if (a) openActivityModal(a, load);
          return;
        }
        const dayEl = e.target.closest("[data-day]");
        if (dayEl) {
          const [y, m, d] = dayEl.dataset.day.split("-").map(Number);
          state.anchor = new Date(y, m - 1, d);
          state.view = "day";
          load();
        }
      });

      load();
    }

    async function load() {
      const [start, end] = range();
      const params = new URLSearchParams({ from: start.toISOString(), to: end.toISOString() });
      if (state.owner === "all") params.set("owner", "all");
      try {
        const data = await api("/agenda?" + params.toString());
        items = data.content;
        render();
      } catch (err) {
        toast(err.message, "err");
      }
    }

    function chip(a) {
      const time = new Date(a.dueAt).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      const cls = a.status === "CONCLUIDA" ? "done" : a.overdue ? "late" : "";
      return `<div class="chip ${cls}" data-id="${a.id}" title="${esc(a.title)}">${ACTIVITY_TYPES[a.type].icon} ${time} ${esc(a.title)}</div>`;
    }

    function render() {
      document.querySelectorAll("#views button").forEach((b) => b.classList.toggle("on", b.dataset.v === state.view));
      document.getElementById("title").textContent = titleText();

      const byDay = {};
      items.forEach((a) => (byDay[dayKey(new Date(a.dueAt))] ||= []).push(a));
      const todayKey = dayKey(new Date());
      const [start] = range();
      const box = document.getElementById("cal");

      if (state.view === "day") {
        const list = byDay[dayKey(startOfDay(state.anchor))] || [];
        box.innerHTML = list.length === 0
          ? `<div class="empty">Nada agendado para este dia.</div>`
          : list.map((a) => `
              <div class="task-row agenda-item ${a.overdue ? "overdue" : ""}" data-id="${a.id}" style="cursor:pointer">
                <div class="body">
                  <div class="t">${ACTIVITY_TYPES[a.type].icon} ${esc(a.title)}</div>
                  <div class="muted">${new Date(a.dueAt).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })} · ${esc(ACTIVITY_TYPES[a.type].label)}${relatedText(a) ? " · " + esc(relatedText(a)) : ""}</div>
                </div>
                ${actStatusBadge(a)}
              </div>`).join("");
        return;
      }

      if (state.view === "week") {
        let html = `<div class="cal-week">`;
        for (let i = 0; i < 7; i++) {
          const d = addDays(start, i);
          const key = dayKey(d);
          html += `
            <div class="cal-day ${key === todayKey ? "today" : ""}">
              <div class="dn" data-day="${key}">${d.toLocaleDateString("pt-BR", { weekday: "short", day: "numeric" })}</div>
              ${(byDay[key] || []).map(chip).join("")}
            </div>`;
        }
        box.innerHTML = html + `</div>`;
        return;
      }

      // Mês
      const month = state.anchor.getMonth();
      let html = `<div class="cal-month">` +
        ["seg", "ter", "qua", "qui", "sex", "sáb", "dom"].map((n) => `<div class="cal-dow">${n}</div>`).join("");
      for (let i = 0; i < 42; i++) {
        const d = addDays(start, i);
        const key = dayKey(d);
        const list = byDay[key] || [];
        html += `
          <div class="cal-day ${d.getMonth() !== month ? "other" : ""} ${key === todayKey ? "today" : ""}">
            <div class="dn" data-day="${key}">${d.getDate()}</div>
            ${list.slice(0, 3).map(chip).join("")}
            ${list.length > 3 ? `<div class="more" data-day="${key}">+ ${list.length - 3} mais</div>` : ""}
          </div>`;
      }
      box.innerHTML = html + `</div>`;
    }

    init();
  </script>
</body>
</html>
