<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RafaLink CRM - Empresa</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/company-form.js"></script>
  <script src="js/contact-form.js"></script>
  <script src="js/opportunity-form.js"></script>
  <script>
    const companyId = new URLSearchParams(location.search).get("id");
    const content = renderLayout("companies", "Detalhe da empresa");

    async function load() {
      try {
        render(await api("/companies/" + companyId));
      } catch (err) {
        content.innerHTML = `<p class="bad">${esc(err.message)}</p><p><a class="link" href="companies.html">← Voltar para empresas</a></p>`;
      }
    }

    function render(c) {
      const contactsHtml = c.contacts.length === 0
        ? `<div class="empty">Nenhum contato nesta empresa ainda.</div>`
        : `<table class="grid">
            <thead><tr><th>Nome</th><th>Cargo</th><th>E-mail</th><th>Telefone</th><th>Status</th></tr></thead>
            <tbody>
              ${c.contacts.map((ct) => `
                <tr class="clickable" data-contact="${ct.id}">
                  <td><strong>${esc(ct.name)}</strong></td>
                  <td>${esc(ct.jobTitle || "—")}</td>
                  <td>${esc(ct.email || "—")}</td>
                  <td>${esc(ct.phone || "—")}</td>
                  <td>${contactStatusBadge(ct.status)}</td>
                </tr>`).join("")}
            </tbody>
          </table>`;
      
      const oppsHtml = c.opportunities.length === 0
        ? `<div class="empty">Nenhuma oportunidade para esta empresa ainda.</div>`
        : `<table class="grid">
            <thead><tr><th>Oportunidade</th><th>Etapa</th><th>Valor</th><th>Probabilidade</th><th>Status</th></tr></thead>
            <tbody>
              ${c.opportunities.map((o) => `
                <tr class="clickable" data-opp="${o.id}">
                  <td><strong>${esc(o.title)}</strong></td>
                  <td>${esc(o.stageName)}</td>
                  <td>${fmtMoney(o.value)}</td>
                  <td>${o.probability}%</td>
                  <td>${oppStatusBadge(o.status)}</td>
                </tr>`).join("")}
            </tbody>
          </table>`;

      content.innerHTML = `
        <p><a href="companies.html" class="muted">← Voltar para empresas</a></p>
        <div class="page-head">
          <div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.industry || "Sem segmento")}</div></div>
          ${typeBadge(c.type)}
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="newContactBtn">+ Novo contato</button>
          <button class="btn btn-primary" id="newOppBtn">+ Nova oportunidade</button>
          <button class="btn" id="editBtn">Editar</button>
          ${canDelete() ? `<button class="btn btn-danger" id="deleteBtn">Excluir</button>` : ""}
        </div>
        <div class="detail-grid">
          ${infoCard("Site", c.website)}
          ${infoCard("Telefone", c.phone)}
          ${infoCard("Cidade", c.city)}
          ${infoCard("Responsável", c.ownerName)}
          ${infoCard("Criada em", fmtDateTime(c.createdAt))}
          ${c.notes ? `<div class="card full"><div class="label">Observações</div><div class="value sm">${esc(c.notes)}</div></div>` : ""}
        </div>

        <h3 class="section-title">Contatos (${c.contacts.length})</h3>
        ${contactsHtml}

        <h3 class="section-title">Oportunidades (${c.opportunities.length})</h3>
        ${oppsHtml}`;

      content.querySelectorAll("tr[data-contact]").forEach((row) =>
        row.addEventListener("click", () => (location.href = "contact.html?id=" + row.dataset.contact))
      );

      document.getElementById("editBtn").addEventListener("click", async () => {
        const opts = await api("/companies/options");
        openCompanyForm({ company: c, owners: opts.owners, onSaved: () => load() });
      });

      document.getElementById("newContactBtn").addEventListener("click", async () => {
        const opts = await api("/contacts/options");
        openContactForm({
          owners: opts.owners,
          companies: opts.companies,
          defaults: { companyId: c.id },
          onSaved: () => load(),
        });
      });

      content.querySelectorAll("tr[data-opp]").forEach((row) =>
        row.addEventListener("click", () => (location.href = "opportunity.html?id=" + row.dataset.opp))
      );

      document.getElementById("newOppBtn").addEventListener("click", async () => {
        const opts = await api("/opportunities/options");
        openOpportunityForm({
          options: opts,
          defaults: { companyId: c.id },
          onSaved: (o) => (location.href = "opportunity.html?id=" + o.id),
        });
      });

      const del = document.getElementById("deleteBtn");
      if (del) del.addEventListener("click", async () => {
        if (!confirm(`Excluir a empresa "${c.name}"?`)) return;
        try {
          await api("/companies/" + c.id, { method: "DELETE" });
          location.href = "companies.html";
        } catch (err) {
          toast(err.message, "err");
        }
      });
    }

    load();
  </script>
</body>
</html>
